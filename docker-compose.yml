services:
  ros2gz:
    build:
      context: .
    image: yourorg/ros2-gz:humble
    tty: true
    stdin_open: true
    ports:
      - "8888:8080"  
      - "5901:5901"      
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - VNC_PASSWORD=12345678
      - NOVNC_PORT=8080
      - VNC_RESOLUTION=640x480
    volumes:
      - ./ws:/home/dev/ws    
